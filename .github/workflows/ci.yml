name: ML CI Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12.7"

jobs:
  setup:
    name: "Stage 1 - Setup dan Install"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: pip install -r Membangun_model/requirements.txt

  preprocessing:
    name: "Stage 2 - Data Preprocessing"
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: pip install -r Membangun_model/requirements.txt
      - name: Jalankan preprocessing
        working-directory: Membangun_model
        run: python wine_quality_preprocessing.py
      - name: Validasi output
        working-directory: Membangun_model
        run: |
          python -c "
          import joblib
          scaler = joblib.load('scaler.pkl')
          print('scaler.pkl valid, fitur:', scaler.mean_.shape[0])
          "
      - name: Upload scaler
        uses: actions/upload-artifact@v4
        with:
          name: scaler-${{ github.sha }}
          path: Membangun_model/scaler.pkl
          retention-days: 7

  training:
    name: "Stage 3 - Model Training"
    runs-on: ubuntu-latest
    needs: preprocessing
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: pip install -r Membangun_model/requirements.txt
      - name: Download scaler
        uses: actions/download-artifact@v4
        with:
          name: scaler-${{ github.sha }}
          path: Membangun_model/
      - name: Jalankan MLflow server
        run: |
          mlflow server --host 127.0.0.1 --port 5000 \
            --backend-store-uri sqlite:///mlflow.db \
            --default-artifact-root ./mlruns &
          sleep 10
      - name: Latih model baseline
        working-directory: Membangun_model
        run: python modelling.py
      - name: Latih model dengan tuning
        working-directory: Membangun_model
        run: python modelling_tuning.py
      - name: Upload model
        uses: actions/upload-artifact@v4
        with:
          name: model-${{ github.sha }}
          path: |
            Membangun_model/best_model.pkl
            Membangun_model/scaler.pkl
            Membangun_model/best_model.json
          retention-days: 30

  upload:
    name: "Stage 4 - Upload ke GitHub"
    runs-on: ubuntu-latest
    needs: training
    steps:
      - uses: actions/checkout@v4
      - name: Download model
        uses: actions/download-artifact@v4
        with:
          name: model-${{ github.sha }}
          path: model-release/
      - name: Buat ZIP
        run: zip -r model_release.zip model-release/
      - name: Upload ke GitHub
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: model_release.zip
          retention-days: 90

  summary:
    name: "Stage 5 - Summary"
    runs-on: ubuntu-latest
    needs: [setup, preprocessing, training, upload]
    if: always()
    steps:
      - name: Tulis summary
        run: |
          echo "## ML CI Pipeline - Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Setup         | ${{ needs.setup.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Preprocessing | ${{ needs.preprocessing.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Training      | ${{ needs.training.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Upload        | ${{ needs.upload.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "Python: ${{ env.PYTHON_VERSION }}" >> $GITHUB_STEP_SUMMARY
