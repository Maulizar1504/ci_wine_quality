name: Advanced ML CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12.7"
  F1_THRESHOLD: "0.70"

jobs:
  lint:
    name: "Stage 1 - Code Quality"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install flake8
        run: pip install flake8
      - name: Run flake8
        run: |
          flake8 Membangun_model/ \
            --max-line-length=120 \
            --ignore=E501,W503,E203,E221,E226,W292,F401,E402,F811,E122,W291,E302,E303,E305,W605,E711,E712 \
            --exclude=__pycache__,*.pyc

  test:
    name: "Stage 2 - Unit Tests"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r Membangun_model/requirements.txt
          pip install pytest pytest-cov
      - name: Run unit tests
        run: pytest tests/ -v --tb=short
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  preprocessing:
    name: "Stage 3 - Data Preprocessing"
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: pip install -r Membangun_model/requirements.txt
      - name: Run preprocessing
        working-directory: Membangun_model
        run: python wine_quality_preprocessing.py
      - name: Validate output
        working-directory: Membangun_model
        run: |
          python -c "
          import joblib, numpy as np
          scaler = joblib.load('scaler.pkl')
          print('Preprocessing validation passed')
          print('Features:', scaler.mean_.shape[0])
          "
      - name: Upload scaler
        uses: actions/upload-artifact@v4
        with:
          name: scaler-${{ github.sha }}
          path: Membangun_model/scaler.pkl
          retention-days: 7

  train:
    name: "Stage 4 - Model Training"
    runs-on: ubuntu-latest
    needs: preprocessing
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: pip install -r Membangun_model/requirements.txt
      - name: Download scaler
        uses: actions/download-artifact@v4
        with:
          name: scaler-${{ github.sha }}
          path: Membangun_model/
      - name: Start MLflow server
        run: |
          mlflow server \
            --host 127.0.0.1 \
            --port 5000 \
            --backend-store-uri sqlite:///mlflow.db \
            --default-artifact-root ./mlruns &
          sleep 10
      - name: Train baseline models
        working-directory: Membangun_model
        run: python modelling.py
      - name: Train with tuning
        working-directory: Membangun_model
        run: python modelling_tuning.py
      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts-${{ github.sha }}
          path: |
            Membangun_model/best_tuned_model.pkl
            Membangun_model/scaler.pkl
            Membangun_model/best_model.json
            Membangun_model/best_tuned_info.json
          retention-days: 30

  evaluate:
    name: "Stage 5 - Evaluation and Quality Gate"
    runs-on: ubuntu-latest
    needs: train
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: pip install -r Membangun_model/requirements.txt
      - name: Download model artifacts
        uses: actions/download-artifact@v4
        with:
          name: model-artifacts-${{ github.sha }}
          path: Membangun_model/
      - name: Quality gate check
        working-directory: Membangun_model
        run: |
          python -c "
          import json, sys
          with open('best_tuned_info.json') as f:
              info = json.load(f)
          f1 = info['test_f1']
          threshold = 0.70
          print('Model    :', info['model_name'])
          print('Test F1  :', round(f1, 4))
          print('Threshold:', threshold)
          if f1 < threshold:
              print('QUALITY GATE FAILED')
              sys.exit(1)
          print('QUALITY GATE PASSED')
          "
      - name: Write summary
        run: |
          echo "## Evaluation Result" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          python -c "
          import json
          with open('Membangun_model/best_tuned_info.json') as f:
              info = json.load(f)
          print('| Model |', info['model_name'], '|')
          print('| Test F1 |', round(info['test_f1'], 4), '|')
          " >> $GITHUB_STEP_SUMMARY

  upload:
    name: "Stage 6 - Upload Artifacts"
    runs-on: ubuntu-latest
    needs: evaluate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Download model artifacts
        uses: actions/download-artifact@v4
        with:
          name: model-artifacts-${{ github.sha }}
          path: release-artifacts/
      - name: Create release zip
        run: |
          zip -r "wine_quality_model.zip" release-artifacts/
          ls -lh *.zip
      - name: Upload to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: "*.zip"
          retention-days: 90
      - name: Upload to DagsHub
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
          GIT_SHA: ${{ github.sha }}
        run: |
          pip install dagshub mlflow scikit-learn joblib pandas numpy
          python - <<PYEOF
          import dagshub, mlflow, os
          dagshub.init(
              repo_owner='alsyamaulizar',
              repo_name='wine-quality-ml',
              mlflow=True
          )
          sha = os.environ.get('GIT_SHA', 'unknown')[:7]
          with mlflow.start_run(run_name='CI_' + sha):
              mlflow.log_artifact('release-artifacts/best_tuned_model.pkl')
              mlflow.log_artifact('release-artifacts/scaler.pkl')
              mlflow.log_artifact('release-artifacts/best_tuned_info.json')
              mlflow.set_tag('ci_run', 'true')
              mlflow.set_tag('git_sha', os.environ.get('GIT_SHA', ''))
          print('Artifacts uploaded to DagsHub')
          PYEOF

  docker:
    name: "Stage 7 - Build and Test Docker"
    runs-on: ubuntu-latest
    needs: evaluate
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Download model artifacts
        uses: actions/download-artifact@v4
        with:
          name: model-artifacts-${{ github.sha }}
          path: Membangun_model/
      - name: Build Docker image
        run: docker build -t wine-quality-inference:latest .
      - name: Test container
        run: |
          docker run -d -p 5001:5001 --name test-container \
            -v $PWD/Membangun_model/scaler.pkl:/app/scaler.pkl \
            -v $PWD/Membangun_model/best_tuned_model.pkl:/app/best_tuned_model.pkl \
            wine-quality-inference:latest
          sleep 15
          curl -sf http://localhost:5001/health && echo "Container is healthy"
          docker stop test-container
          docker rm test-container
      - name: Push to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker tag wine-quality-inference:latest ghcr.io/${{ github.repository }}/wine-quality-inference:latest
          docker push ghcr.io/${{ github.repository }}/wine-quality-inference:latest

  summary:
    name: "Stage 8 - Pipeline Summary"
    runs-on: ubuntu-latest
    needs: [lint, test, preprocessing, train, evaluate, upload, docker]
    if: always()
    steps:
      - name: Write summary
        run: |
          echo "## Wine Quality ML - Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Code Quality  | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests    | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Preprocessing | ${{ needs.preprocessing.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Training      | ${{ needs.train.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Evaluation    | ${{ needs.evaluate.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Upload        | ${{ needs.upload.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker        | ${{ needs.docker.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "Python: ${{ env.PYTHON_VERSION }}" >> $GITHUB_STEP_SUMMARY